# Cấu hình server. Khóa không có trong file thì dùng giá trị mặc định.

# --- Mạng ---
bind_address      = 0.0.0.0
port              = 5500
send_buffer_max   = 262144     # 256 KB chờ gửi tối đa cho 1 kết nối

# --- Thread pool ---
read_workers      = 2          # luồng băm mật khẩu + đọc DB
job_queue_max     = 10000      # vượt quá thì trả 9002 SERVER_BUSY

# --- Lưu trữ ---
db_path           = data/game.db
log_path          = logs/server.log

# --- Bảo mật ---
pbkdf2_iterations = 100000
